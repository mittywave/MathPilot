<!doctype html>
<meta charset="utf-8">
<title>闭环演示动画</title>
<!--
  Source of public/intro/loop/<step>-{light,dark}.mp4, the demos the 01 闭环 cards on / play at the front.
  Each step is a short animation of the app redrawn in the product page's colours, not a screen recording; the labels
  are the app's own. scripts/render-intro-loop.mjs turns them into the videos (`--serve` prints a preview address;
  ?scene=intake&mode=dark picks one). Every frame is a function of time, so the render steps through them exactly.

  The first and last 0.8 s of every demo are the card's face as Intro.tsx draws it (.mp-step-face in intro.css: the
  number, the name in the ∞'s metal, the same background), so the card turns into its video and loops without a seam.
  Keep the two in step. The pill in the window's title bar counts only the teacher's own time: it stops while the
  machine works (AI, typesetting) or days pass, and says so.
-->
<link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
<script src="../node_modules/katex/dist/katex.min.js"></script>
<style>
  :root { --sans:"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif; }
  html, body { margin:0; }
  body { background:#8a8885; font-family:var(--sans); }
  body[data-render] { background:transparent; }
  body:not([data-render]) .stage { margin:24px auto 12px; box-shadow:0 20px 60px -30px rgba(0,0,0,.6); }

  /* the product page's colours (app/(home)/intro.css), and the card face's background over them */
  .stage[data-mode="light"] { --bg:#EBE9E5; --fg:#151514; --acc:#3E5E4C; --paper:#F8F7F4; --err:#A4503B; --on-acc:#F8F7F4;
    --metal:linear-gradient(180deg, #6A655C 0%, #989183 30%, #BDB7A9 46%, #8C8579 62%, #5E5950 100%);
    --pill-bg:#1D1D1B; --pill-fg:#F1EFEA; --pill-acc:#9DBFAA; --shade:rgba(21,21,20,.42); }
  .stage[data-mode="dark"] { --bg:#111110; --fg:#F1EFEA; --acc:#9DBFAA; --paper:#1D1D1B; --err:#DA8A73; --on-acc:#111110;
    --metal:linear-gradient(180deg, #A39E94 0%, #D6D3CA 30%, #F4F2ED 46%, #BAB6AA 62%, #8C877D 100%);
    --pill-bg:#F1EFEA; --pill-fg:#151514; --pill-acc:#3E5E4C; --shade:rgba(0,0,0,.8); }
  .stage { --ink:var(--fg); --face:color-mix(in srgb, var(--fg) 3%, var(--bg));
    --panel:color-mix(in srgb, var(--fg) 4%, var(--paper)); --soft:color-mix(in srgb, var(--fg) 62%, var(--paper));
    --faint:color-mix(in srgb, var(--fg) 36%, var(--paper)); --line:color-mix(in srgb, var(--fg) 13%, transparent);
    --wash:color-mix(in srgb, var(--acc) 15%, var(--paper)); --err-wash:color-mix(in srgb, var(--err) 14%, var(--paper));
    --sheet:#FBFAF6; --sheet-ink:#1C1C1A; --sheet-line:#DCD9D1; --sheet-acc:#3E5E4C; --sheet-err:#B23A26; --ink-blue:#23407C;
    position:relative; width:725px; height:500px; overflow:hidden; background:var(--face); color:var(--ink);
    font-family:var(--sans); -webkit-font-smoothing:antialiased; }

  /* the card face, exactly as .mp-step-face */
  .face { position:absolute; inset:0; display:grid; place-items:center; container-type:size; }
  .face-no { position:absolute; top:9cqh; left:7cqw; font-family:var(--serif); font-size:8cqh; color:var(--acc); }
  .face-name { padding-left:.06em; font-family:var(--serif); font-size:36cqh; line-height:1; letter-spacing:.06em; color:transparent;
    background:var(--metal); -webkit-background-clip:text; background-clip:text; }

  .cam { position:absolute; inset:0; }
  .win { position:absolute; inset:12px; overflow:hidden; border:1px solid var(--line); border-radius:11px; background:var(--paper);
    box-shadow:0 16px 36px -26px var(--shade); }
  .bar { position:absolute; inset:0 0 auto; display:flex; align-items:center; gap:20px; height:34px; padding:0 14px; border-bottom:1px solid var(--line);
    font-size:11.5px; color:var(--soft); box-sizing:border-box; }
  .bar .brand { display:flex; color:var(--ink); }
  .bar .brand svg { width:auto; height:13px; }
  .bar .brand-text { font-family:var(--serif); font-size:14px; }
  .bar nav { display:flex; gap:14px; }
  .bar nav span { position:relative; }
  .bar nav .on { color:var(--ink); font-weight:600; }
  .bar nav .on::after { content:""; position:absolute; right:0; bottom:-11px; left:0; height:2px; border-radius:1px; background:var(--acc); }
  .body { position:absolute; inset:34px 0 0; overflow:hidden; }
  .view { position:absolute; inset:0; }
  .layer { position:absolute; inset:0; }

  .rail { position:absolute; inset:0 auto 0 0; width:150px; padding:14px 10px; border-right:1px solid var(--line); background:var(--panel); box-sizing:border-box; }
  .eyebrow { font-size:10.5px; letter-spacing:.08em; color:var(--faint); }
  .rail .eyebrow { margin:0 6px 8px; }
  .rail .item { display:flex; justify-content:space-between; align-items:center; height:27px; padding:0 8px; border-radius:7px; font-size:12.5px; color:var(--soft); }
  .rail .item.on { background:var(--wash); color:var(--acc); font-weight:600; }
  .rail .item small { font-size:10.5px; font-weight:400; color:var(--faint); }
  .rail .item.on small { color:var(--acc); }
  .main { position:absolute; inset:0 0 0 150px; padding:14px 16px; box-sizing:border-box; }
  .main.full { left:0; }
  .head { display:flex; align-items:center; gap:10px; height:30px; }
  .head h3 { margin:0; font-size:16px; font-weight:600; }
  .head .count { font-size:12px; color:var(--soft); font-variant-numeric:tabular-nums; }
  .grow { flex:1; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:28px; padding:0 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper); color:var(--ink); font-size:12.5px; white-space:nowrap; box-sizing:border-box; }
  .btn.primary { border-color:transparent; background:var(--acc); color:var(--on-acc); font-weight:600; }
  .btn.ghost { background:transparent; }
  .btn.small { height:24px; padding:0 9px; border-radius:7px; font-size:11.5px; }
  .search, .input, .select { display:flex; align-items:center; gap:8px; height:30px; padding:0 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper); font-size:12px; box-sizing:border-box; }
  .search { margin-top:10px; color:var(--faint); }
  .select::after { content:"▾"; margin-left:auto; color:var(--faint); font-size:10px; }
  .lbl { margin-bottom:4px; font-size:11px; color:var(--soft); }

  .list { position:relative; display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .qcard { position:relative; padding:9px 12px 10px; border:1px solid var(--line); border-radius:10px; background:var(--paper); }
  .qcard .meta { display:flex; gap:8px; font-size:11px; color:var(--soft); }
  .qcard .meta .id { margin:0 -5px; padding:0 5px; border-radius:5px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums;
    background:color-mix(in srgb, var(--acc) calc(var(--hl, 0) * 30%), transparent); }
  .qcard .stem { margin-top:5px; font-family:var(--serif); font-size:13.5px; line-height:1.55; }
  .qcard.pickable { padding-left:42px; }
  .qcard.pickable.on { border-color:color-mix(in srgb, var(--acc) 55%, var(--line)); background:color-mix(in srgb, var(--acc) 6%, var(--paper)); }
  .check { position:absolute; top:50%; left:13px; display:grid; place-items:center; width:18px; height:18px; margin-top:-9px; border:1.5px solid var(--faint);
    border-radius:5px; box-sizing:border-box; }
  .check svg { width:12px; height:12px; opacity:0; }
  .check path { fill:none; stroke:var(--on-acc); stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .on > .check, .check.on { border-color:var(--acc); background:var(--acc); }
  .on > .check svg, .check.on svg { opacity:1; }
  .cb { display:flex; align-items:center; gap:7px; font-size:12px; }
  .cb .check { position:relative; top:auto; left:auto; flex:none; width:16px; height:16px; margin:0; }

  .backdrop { position:absolute; inset:0; background:color-mix(in srgb, var(--fg) 12%, transparent); }
  .modal { position:absolute; top:8px; bottom:8px; left:50%; display:flex; flex-direction:column; width:560px; margin-left:-280px; overflow:hidden;
    border:1px solid var(--line); border-radius:12px; background:var(--paper); box-shadow:0 24px 60px -28px var(--shade); }
  .mhead { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 8px; }
  .mhead .eyebrow { color:var(--acc); }
  .mhead h2 { margin:2px 0 0; font-size:16px; font-weight:600; }
  .x { display:grid; place-items:center; width:24px; height:24px; border-radius:6px; font-size:16px; color:var(--soft); }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 16px; }
  .modes > div { padding:6px 10px; border:1px solid var(--line); border-radius:9px; font-size:11px; color:var(--soft); }
  .modes b { display:block; font-size:12.5px; font-weight:600; color:var(--ink); }
  .modes .on { border-color:color-mix(in srgb, var(--acc) 60%, transparent); background:var(--wash); }
  .mbody { position:relative; flex:1; margin:10px 16px; }
  .mfoot { display:flex; justify-content:flex-end; gap:8px; padding:9px 16px 11px; border-top:1px solid var(--line); }

  .capture { position:absolute; inset:0; display:flex; align-items:center; gap:16px; padding:0 22px; border:1.5px dashed color-mix(in srgb, var(--acc) 55%, transparent);
    border-radius:12px; background:color-mix(in srgb, var(--acc) 5%, var(--paper)); }
  .capture .icon { display:grid; place-items:center; flex:none; width:54px; height:54px; border-radius:14px; background:var(--wash); color:var(--acc); font-size:16px; font-weight:700; }
  .capture b { font-size:15px; }
  .capture p { margin:4px 0 0; font-size:11.5px; color:var(--soft); }
  .capture .note { margin-left:auto; font-size:11px; color:var(--acc); }
  .recog { position:absolute; inset:0; display:grid; grid-template-columns:200px 1fr; grid-template-rows:128px 1fr; gap:10px 14px; }
  .src { position:relative; overflow:hidden; border:1px solid var(--line); border-radius:9px; background:var(--panel); }
  .scan { position:absolute; right:0; left:0; height:38px; background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--acc) 26%, transparent) 78%, var(--acc)); }
  .recognizing { position:absolute; inset:0; display:grid; place-content:center; gap:3px; text-align:center; background:color-mix(in srgb, var(--paper) 50%, transparent); }
  .recognizing b { font-size:12.5px; }
  .recognizing span { font-size:10.5px; color:var(--soft); }
  .status b { display:block; margin-top:2px; font-size:13.5px; }
  .fields { display:grid; gap:6px; margin-top:8px; }
  .field { display:grid; grid-template-columns:52px 1fr; align-items:center; font-size:11.5px; color:var(--soft); }
  .field .val { display:flex; align-items:center; height:24px; padding:0 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; color:var(--ink); }
  .stembox { grid-column:1 / -1; display:flex; gap:12px; padding:8px 12px; border:1px solid var(--line); border-radius:9px; font-family:var(--serif); font-size:12.5px; line-height:1.62; }
  .stembox .ans { margin-top:4px; padding-top:4px; border-top:1px dashed var(--line); font-size:12px; color:var(--soft); }
  .stembox .ans b { color:var(--acc); font-weight:600; }
  .fig { flex:none; }
  .fig path.curve { stroke-dasharray:1; stroke-dashoffset:calc(1 - var(--draw, 1)); }

  .photo { position:absolute; inset:6px; display:flex; gap:6px; padding:8px 9px; overflow:hidden; border-radius:3px; background:var(--sheet); color:var(--sheet-ink);
    font-family:var(--serif); font-size:8.4px; line-height:1.55; box-shadow:0 6px 16px -8px rgba(0,0,0,.45); }
  .photo::after { content:""; position:absolute; inset:0; background:linear-gradient(112deg, rgba(255,255,255,.3), rgba(0,0,0,.04) 58%, rgba(0,0,0,.13)); }
  .photo .katex { font-size:1em; }

  .drop { position:absolute; inset:0; display:grid; place-content:center; gap:4px; text-align:center; border:1.5px dashed color-mix(in srgb, var(--acc) 50%, transparent);
    border-radius:12px; background:color-mix(in srgb, var(--acc) calc(4% + var(--hl, 0) * 12%), var(--paper)); font-size:13.5px; }
  .drop small { font-size:11px; color:var(--soft); }
  .drafts .eyebrow { color:var(--acc); }
  .drafts h5 { margin:2px 0 8px; font-size:14px; }
  .draft { display:grid; grid-template-columns:22px 1fr; gap:8px; align-items:center; margin-bottom:6px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-family:var(--serif); font-size:12px; }
  .draft .check { position:relative; top:auto; left:auto; width:15px; height:15px; margin:0; }
  .more { font-size:11px; color:var(--faint); }
  .file { position:absolute; display:flex; align-items:center; gap:7px; padding:6px 10px 6px 7px; border:1px solid var(--line); border-radius:8px; background:var(--paper);
    font-size:11.5px; white-space:nowrap; box-shadow:0 12px 24px -14px var(--shade); }
  .file i { display:grid; place-items:center; width:20px; height:24px; border-radius:3px; background:#2B579A; color:#fff; font-size:11px; font-style:normal; font-weight:700; }
  .toast { position:absolute; right:0; bottom:16px; left:0; width:max-content; margin:0 auto; padding:7px 14px; border-radius:8px; background:var(--pill-bg); color:var(--pill-fg);
    font-size:12px; box-shadow:0 10px 24px -14px rgba(0,0,0,.5); }

  .dock { position:absolute; right:16px; bottom:12px; left:16px; display:flex; align-items:center; gap:14px; height:46px; padding:0 8px 0 16px; border:1px solid var(--line);
    border-radius:12px; background:var(--paper); box-shadow:0 14px 30px -18px var(--shade); box-sizing:border-box; }
  .dock .n { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .dock .n small { margin-left:5px; font-size:11px; font-weight:400; color:var(--soft); }
  .dock .t { font-size:11px; color:var(--soft); }
  .dock .t b { display:block; font-size:12px; color:var(--ink); }

  .outline { display:flex; flex-direction:column; gap:7px; margin-top:14px; }
  .orow { display:flex; align-items:center; gap:10px; height:40px; padding:0 10px; border:1px solid var(--line); border-radius:9px; background:var(--paper); font-size:12px; }
  .orow .no { width:16px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .orow .id { font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
  .orow .stem { flex:1; overflow:hidden; font-family:var(--serif); font-size:12.5px; white-space:nowrap; }
  .orow .ops { display:flex; gap:4px; }
  .orow .ops span { padding:2px 6px; border:1px solid var(--line); border-radius:5px; font-size:10.5px; color:var(--soft); }
  .links { display:flex; gap:14px; margin-top:10px; font-size:11.5px; color:var(--acc); }

  .split { position:absolute; inset:0; display:grid; grid-template-columns:var(--side, 210px) 1fr; }
  .side { display:flex; flex-direction:column; gap:10px; padding:14px; border-right:1px solid var(--line); background:var(--panel); }
  .seg { display:flex; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:var(--paper); }
  .seg span { flex:1; padding:5px 0; font-size:11.5px; text-align:center; color:var(--soft); }
  .seg span.on { background:var(--acc); color:var(--on-acc); font-weight:600; }
  .stack { position:relative; }
  .a4 { position:absolute; top:14px; left:50%; width:258px; height:364px; margin-left:-129px; padding:16px 18px; overflow:hidden; border-radius:3px; background:var(--sheet);
    color:var(--sheet-ink); font-family:var(--serif); font-size:9.5px; line-height:1.7; box-shadow:0 14px 34px -18px rgba(0,0,0,.55); box-sizing:border-box; }
  .a4 h4 { margin:0 0 2px; font-size:12.5px; text-align:center; }
  .a4 .sub { margin-bottom:8px; font-family:var(--sans); font-size:7.5px; text-align:center; color:#77746c; }
  .a4 .q { margin-bottom:9px; }
  .a4 .key { margin-top:2px; font-size:9px; color:var(--sheet-acc); }
  .a4 .rule { height:1px; margin:10px 0; background:var(--sheet-line); }
  .a4 .blank { height:5px; margin:7px 0; border-radius:3px; background:#E8E5DE; }

  .textarea { min-height:72px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); font-size:12.5px; line-height:1.55; box-sizing:border-box; }
  .textarea.short { min-height:46px; }
  .ph { color:var(--faint); }
  .caret { display:inline-block; width:1.5px; height:1.1em; margin-left:1px; vertical-align:-2px; background:var(--acc); }
  .out { position:relative; padding:14px; }
  .busy { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--soft); }
  .spin { width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--acc); border-radius:50%; box-sizing:border-box; }
  .brief { padding:8px 11px; border:1px solid var(--line); border-radius:9px; font-size:11.5px; line-height:1.6; }
  .brief h6 { margin:0 0 2px; font-size:12px; }
  .brief dl { display:grid; grid-template-columns:auto 1fr; gap:0 10px; margin:0; }
  .brief dt { color:var(--soft); }
  .brief dd { margin:0; }
  .brief .find { color:var(--err); }
  .days { display:grid; grid-template-columns:repeat(5, 1fr); gap:7px; margin-top:9px; }
  .day { display:flex; flex-direction:column; gap:5px; padding:7px 6px; border:1px solid var(--line); border-radius:9px; }
  .day h6 { margin:0 0 1px; font-size:11.5px; }
  .qchip { padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:var(--panel); font-size:10.5px; font-variant-numeric:tabular-nums; }
  .qchip em { display:block; font-size:9.5px; font-style:normal; color:var(--acc); }
  .qchip.focus em { color:var(--err); }
  .caption { position:absolute; inset:0; display:grid; place-items:center; background:color-mix(in srgb, var(--paper) 88%, transparent); font-family:var(--serif);
    font-size:30px; letter-spacing:.08em; }

  .hd-top { display:flex; align-items:flex-end; gap:14px; padding:12px 16px 0; }
  .crumb { font-size:10.5px; color:var(--faint); }
  .hd-title { margin-top:2px; font-family:var(--serif); font-size:17px; font-weight:600; }
  .tabs { display:flex; gap:2px; padding:2px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
  .tabs span { padding:4px 12px; border-radius:6px; font-size:11.5px; color:var(--soft); }
  .tabs .on { background:var(--paper); color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .page { position:absolute; top:62px; right:16px; bottom:0; left:16px; overflow:hidden; border:1px solid var(--line); border-bottom:0; border-radius:10px 10px 0 0;
    background:var(--paper); font-family:var(--serif); }
  .sheet { position:absolute; inset:14px 22px; }
  .sheet h4 { margin:0 0 9px; font-size:14px; }
  .lane { position:relative; display:grid; grid-template-columns:44px 1fr; gap:10px; margin-bottom:8px; font-size:12.5px; line-height:1.75; }
  .lane > span:first-child { padding-top:2px; font-family:var(--sans); font-size:10.5px; letter-spacing:.06em; color:var(--acc); }
  .lane .faint { color:var(--faint); }
  .lane p { margin:0; }
  .pick { display:inline-flex; align-items:center; gap:5px; width:max-content; padding:1px 9px; border:1px dashed color-mix(in srgb, var(--acc) 55%, transparent); border-radius:7px;
    font-family:var(--sans); font-size:11.5px; color:var(--acc); }
  .picker { position:absolute; top:0; right:0; bottom:0; display:flex; flex-direction:column; gap:8px; width:240px; padding:12px; border-left:1px solid var(--line);
    background:var(--paper); box-shadow:-18px 0 40px -30px var(--shade); box-sizing:border-box; }
  .picker h5 { margin:0; font-size:13px; }
  .pcard { padding:7px 9px; border:1px solid var(--line); border-radius:9px; font-size:10.5px; color:var(--soft); }
  .pcard .stem { margin-top:3px; font-family:var(--serif); font-size:12.5px; color:var(--ink); }
  .pcard .sel { float:right; padding:0 6px; border:1px solid color-mix(in srgb, var(--acc) 50%, transparent); border-radius:6px; color:var(--acc); }
  .pcard.on .sel { background:var(--acc); color:var(--on-acc); }
  .export { position:absolute; top:84px; left:50%; width:318px; margin-left:-159px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:var(--paper);
    box-shadow:0 24px 60px -28px var(--shade); box-sizing:border-box; }
  .export h5 { margin:0 0 10px; font-size:14px; }
  .export .hint { margin:8px 0 12px; font-size:11px; color:var(--soft); }
  .progress { height:4px; margin-top:10px; overflow:hidden; border-radius:2px; background:var(--panel); }
  .progress i { display:block; width:calc(var(--p, 0) * 100%); height:100%; background:var(--acc); }

<body>
<div id="stage" class="stage"></div>
<script>
"use strict";

// ---- time ----------------------------------------------------------------------------------------------------------
// Everything moves along keyed tracks (time, value, ease), plus hooks that read the time; seek(t) draws the frame at t.
const EASE = {
  lin: (p) => p,
  in: (p) => p ** 3,
  out: (p) => 1 - (1 - p) ** 3,
  io: (p) => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2),
  back: (p) => 1 + 2.4 * (p - 1) ** 3 + 1.4 * (p - 1) ** 2,
};
const tracks = new Map();
const hooks = [];
const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
function anim(el, prop, keys) {
  if (!tracks.has(el)) tracks.set(el, new Map());
  const props = tracks.get(el);
  props.set(prop, [...(props.get(prop) ?? []), ...keys].sort((a, b) => a[0] - b[0]));
}
function sample(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, ease = "io"] = keys[i];
    if (t < t1) {
      const [t0, v0] = keys[i - 1];
      return v0 + (v1 - v0) * EASE[ease]((t - t0) / (t1 - t0));
    }
  }
  return keys[keys.length - 1][1];
}
const every = (fn) => hooks.push(fn);
function seek(t) {
  for (const [el, props] of tracks) {
    const v = (p, d) => (props.has(p) ? sample(props.get(p), t) : d);
    if (props.has("x") || props.has("y") || props.has("s") || props.has("r")) {
      el.style.transform = `translate(${v("x", 0)}px, ${v("y", 0)}px) scale(${v("s", 1)}) rotate(${v("r", 0)}deg)`;
    }
    if (props.has("o")) el.style.opacity = v("o", 1);
    for (const [p, keys] of props) if (p.startsWith("--")) el.style.setProperty(p, sample(keys, t));
  }
  for (const fn of hooks) fn(t);
}

// ---- kit -----------------------------------------------------------------------------------------------------------
const stage = document.getElementById("stage");
const params = new URLSearchParams(location.search);
const mode = params.get("mode") === "dark" ? "dark" : "light";
stage.dataset.mode = mode;
const CHECK = `<span class="check"><svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.6 9.6 3.6"/></svg></span>`;
const ARROW = `<svg viewBox="0 0 24 30" width="18" height="23"><path d="M2.5 1.8 L2.5 22.8 L7.6 17.9 L11.3 26.6 L15.1 25 L11.4 16.6 L18.6 16.6 Z" fill="#141a17" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg>`;
const html = (parent, markup) => {
  const t = document.createElement("template");
  t.innerHTML = markup.trim();
  const node = t.content.firstElementChild;
  parent.append(node);
  return node;
};
const tex = (s) => s.replace(/\$([^$]+)\$/g, (_, x) => katex.renderToString(x, { throwOnError: false }));
const show = (el, t, { d = 0.35, y = 8, x = 0, s = null, ease = "out" } = {}) => {
  anim(el, "o", [[t, 0], [t + d, 1, ease]]);
  if (y) anim(el, "y", [[t, y], [t + d, 0, ease]]);
  if (x) anim(el, "x", [[t, x], [t + d, 0, ease]]);
  if (s != null) anim(el, "s", [[t, s], [t + d, 1, "back"]]);
};
const hide = (el, t, { d = 0.3, y = 0 } = {}) => {
  anim(el, "o", [[t, 1], [t + d, 0]]);
  if (y) anim(el, "y", [[t, 0], [t + d, y]]);
};
// visible over the given [from, to] stretches only, fading at each end
const during = (el, spans, d = 0.25) => anim(el, "o", spans.flatMap(([a, b]) => [[a, 0], [a + d, 1], [b - d, 1], [b, 0]]));
const flag = (el, cls, from, to = Infinity) => every((t) => el.classList.toggle(cls, t >= from && t < to));
const texts = (el, keys) => every((t) => {
  let s = keys[0][1];
  for (const [k, v] of keys) if (t >= k) s = v;
  if (el.textContent !== s) el.textContent = s;
});
const count = (el, keys, fmt = (v) => String(Math.round(v))) => every((t) => { el.textContent = fmt(sample(keys, t)); });
// typed text; the caret shows while the field has the focus, steady while typing and blinking otherwise
function typing(el, str, t0, { cps = 3.2, focus = t0 - 0.1, blur = Infinity } = {}) {
  const chars = [...str], t1 = t0 + chars.length / cps;
  const text = document.createElement("span"), caret = document.createElement("i");
  caret.className = "caret";
  el.append(text, caret);
  every((t) => {
    text.textContent = chars.slice(0, clamp(Math.floor((t - t0) * cps + 1e-6), 0, chars.length)).join("");
    const on = t >= focus && t < blur && (t < t1 + 0.05 || Math.floor((t - t1) * 2.2) % 2 === 0);
    caret.style.opacity = on ? 1 : 0;
  });
  return t1;
}
const flash = (el, t, hold = 0.9) => anim(el, "--hl", [[t, 0], [t + 0.2, 1], [t + 0.2 + hold, 1], [t + 0.6 + hold, 0]]);
const press = (el, t) => anim(el, "s", [[t, 1], [t + 0.07, 0.95], [t + 0.2, 1, "out"]]);

let camBox = null;
const pos = (target, dx = 0.5, dy = 0.5) => {
  if (Array.isArray(target)) return target;
  const r = target.getBoundingClientRect();
  return [r.left - camBox.left + r.width * dx, r.top - camBox.top + r.height * dy];
};

// The cursor glides along eased arcs between the places it is sent, presses on each click and leaves a ripple.
class Cursor {
  constructor(layer, start) {
    this.layer = layer;
    this.el = html(layer, `<div class="cursor">${ARROW}</div>`);
    this.start = start;
    this.moves = [];
    this.clicks = [];
    every((t) => {
      const [x, y] = this.at(t);
      const pressed = this.clicks.some((c) => t >= c && t < c + 0.14);
      this.el.style.transform = `translate(${x - 2}px, ${y - 1.5}px) scale(${pressed ? 0.86 : 1})`;
    });
  }
  go(t, target, d = 0.5, { dx = 0.5, dy = 0.5 } = {}) {
    const [x, y] = pos(target, dx, dy);
    this.moves.push({ t0: t, t1: t + d, x, y });
    this.moves.sort((a, b) => a.t0 - b.t0);
    return t + d;
  }
  at(t) {
    let [x, y] = this.start;
    for (const m of this.moves) {
      if (t >= m.t1) { x = m.x; y = m.y; continue; }
      if (t > m.t0) {
        const p = EASE.io((t - m.t0) / (m.t1 - m.t0));
        const bend = Math.min(36, Math.hypot(m.x - x, m.y - y) * 0.1) * Math.sin(Math.PI * p);
        return [x + (m.x - x) * p, y + (m.y - y) * p - bend];
      }
      break;
    }
    return [x, y];
  }
  tap(t, target) {
    if (target) press(target, t);
    this.clicks.push(t);
    const [x, y] = this.at(t);
    const ring = html(this.layer, `<div class="ripple" style="left:${x}px;top:${y}px"></div>`);
    anim(ring, "o", [[t, 0], [t + 0.01, 0.95], [t + 0.5, 0, "out"]]);
    anim(ring, "s", [[t, 0.3], [t + 0.5, 1.3, "out"]]);
    return t;
  }
  // something the cursor holds from `t0` to `t1`, offset from its tip
  carry(node, t0, t1, [ox, oy] = [10, 12]) {
    node.classList.add("carry");
    this.layer.append(node);
    anim(node, "o", [[t0 - 0.01, 0], [t0, 1], [t1, 1], [t1 + 0.15, 0]]);
    every((t) => {
      const [x, y] = this.at(clamp(t, t0, t1));
      node.style.left = `${x + ox}px`;
      node.style.top = `${y + oy}px`;
    });
  }
}

// ⌘ V and the like, shown as keycaps by the cursor
function keys(layer, labels, t0, t1, [x, y]) {
  const node = html(layer, `<div class="keys" style="left:${x}px;top:${y}px">${labels.map((k) => `<kbd>${k}</kbd>`).join("")}</div>`);
  [...node.children].forEach((key, i) => {
    show(key, t0 + i * 0.08, { d: 0.25, y: 6, s: 0.8 });
    anim(key, "y", [[t0 + 0.45 + i * 0.08, 0], [t0 + 0.55 + i * 0.08, 2], [t0 + 0.7 + i * 0.08, 0]]);
  });
  hide(node, t1);
}
const toast = (layer, t0, t1, text) => during(html(layer, `<div class="toast">${text}</div>`), [[t0, t1]]);

// the y = x² − 2x − 3 figure of the demo question, 30 px a unit, origin at (−30, 0)
function parabola(width, { color = "currentColor", draw = false } = {}) {
  const pts = [];
  for (let x = -1.4; x <= 3.401; x += 0.05) pts.push(`${(-30 + 30 * x).toFixed(1)},${(-30 * (x * x - 2 * x - 3)).toFixed(1)}`);
  const label = (x, y, s) => `<text x="${x}" y="${y}" style="font:italic 15px 'Times New Roman',serif" fill="${color}">${s}</text>`;
  return `<svg class="fig" width="${width}" viewBox="-105 -62 210 232" style="color:${color}">
    <line x1="-95" y1="0" x2="98" y2="0" stroke="currentColor" stroke-width="1.3"/><path d="M92 -4 98 0 92 4" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <line x1="-30" y1="160" x2="-30" y2="-55" stroke="currentColor" stroke-width="1.3"/><path d="M-34 -49 -30 -55 -26 -49" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path class="${draw ? "curve" : ""}" pathLength="1" d="M${pts.join(" L")}" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <polygon points="-60,0 -30,90 0,120 60,0" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"/>
    ${label(90, 18, "x")}${label(-24, -44, "y")}${label(-46, 16, "O")}${label(-78, -6, "A")}${label(64, -6, "B")}${label(-52, 98, "C")}${label(4, 140, "D")}
  </svg>`;
}

// a handwriting face from the ones macOS keeps, for the students' answers
function handwriting() {
  const ctx = document.createElement("canvas").getContext("2d");
  const width = (font) => { ctx.font = `20px ${font}`; return ctx.measureText("手写答案 = −8 ＋ 1").width; };

// ---- the frame of every scene --------------------------------------------------------------------------------------
async function boot() {
  const name = SCENES[params.get("scene")] ? params.get("scene") : "intake";
  const scene = SCENES[name];
  const D = scene.duration;
  const face = html(stage, `<div class="face"><span class="face-no">${scene.no}</span><span class="face-name">${scene.name}</span></div>`);
  const cam = html(stage, `<div class="cam"><div class="win"><header class="bar"><span class="brand">${await wordmark()}</span><nav>${NAV.map((n) => `<span>${n}</span>`).join("")}</nav></header><div class="body"></div></div></div>`);
  const body = cam.querySelector(".body");
  stage.style.setProperty("--hand", `"${handwriting()}", "Kaiti SC", serif`);
  const navs = [...cam.querySelectorAll(".bar nav span")];
  const navKeys = [[0, scene.nav]];
  const nav = (t, label) => navKeys.push([t, label]);
  every((t) => {
    let on = navKeys[0][1];
    for (const [k, v] of navKeys.sort((a, b) => a[0] - b[0])) if (t >= k) on = v;
    for (const n of navs) n.classList.toggle("on", n.textContent === on);
  });
  const ready = async () => {
    await document.fonts.ready;
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    camBox = cam.getBoundingClientRect();
  };
  const clock = await scene.build({ body, cam, ready, nav });

  // bookends: the card's face, the app coming up out of it, and back
  anim(face, "o", [[0.8, 1], [1.25, 0], [D - 0.95, 0], [D - 0.3, 1]]);
  const faceName = face.querySelector(".face-name");
  anim(faceName, "s", [[0.8, 1], [1.25, 1.06, "out"], [D - 0.95, 0.96], [D - 0.3, 1, "out"]]);
  anim(cam, "o", [[0.85, 0], [1.3, 1], [D - 1.0, 1], [D - 0.45, 0]]);
  anim(cam, "y", [[0.85, 10], [1.35, 0, "out"]]);

  // the pill: the teacher's time, stopped while the machine works or days pass
  const pill = html(stage, `<div class="pill"><span class="ff"><i></i><b class="chev">››</b></span><span class="clock"><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.8"/><path d="M6 3.4V6l1.8 1.2"/></svg>老师操作 <b class="t">0:00</b></span></div>`);
  const ff = pill.querySelector(".ff"), label = ff.querySelector("i"), chev = ff.querySelector(".chev"), digits = pill.querySelector(".t");
  const spans = [...clock.machine.map(([a, b, l]) => ({ a, b, l: `${l} · 快进`, fast: true })), ...(clock.wait ?? []).map(([a, b, l]) => ({ a, b, l, fast: false }))];
  const widths = new Map(spans.map((s) => { label.textContent = s.l; chev.style.display = s.fast ? "" : "none"; return [s, ff.scrollWidth]; }));
  anim(pill, "o", [[1.0, 0], [1.3, 1], [D - 1.05, 1], [D - 0.6, 0]]);
  anim(pill, "s", [[clock.final, 1], [clock.final + 0.2, 1.1, "out"], [clock.final + 0.5, 1]]);
  every((t) => {
    let secs = 0;
    for (const [a, b] of clock.act) secs += clamp(t - a, 0, b - a);
    digits.textContent = `${Math.floor(secs / 60)}:${String(Math.floor(secs % 60)).padStart(2, "0")}`;
    const span = spans.find((s) => t >= s.a && t < s.b);
    const f = span ? clamp((t - span.a) / 0.2) * clamp((span.b - t) / 0.2) : 0;
    if (span) { label.textContent = span.l; chev.style.display = span.fast ? "" : "none"; }
    ff.style.opacity = f;
    ff.style.width = `${f * (span ? widths.get(span) : 0)}px`;
    ff.style.marginRight = `${f * 2 - 8 * (1 - f)}px`;
    chev.style.transform = `translateX(${((t * 2.4) % 1) * 3}px)`;
    digits.style.opacity = 1 - 0.5 * f;
    digits.style.color = t >= clock.final ? "var(--pill-acc)" : "";
  });

  window.scene = { name, duration: D, fps: 30 };
  window.seek = seek;
  seek(0);
  if (!params.has("render")) preview(name, D);
}

// outside a render: play it, with a scrubber and links to the other scenes and modes
function preview(name, D) {
  const bar = html(document.body, `<div class="controls">${Object.keys(SCENES).map((s) => `<a class="${s === name ? "on" : ""}" href="?scene=${s}&mode=${mode}">${s}</a>`).join("")}
    <a href="?scene=${name}&mode=${mode === "dark" ? "light" : "dark"}">${mode === "dark" ? "浅色" : "深色"}</a>
    <button type="button">暂停</button><input type="range" min="0" max="${D}" step="0.01" value="0"><span>0.00</span></div>`);
  const [button, range, readout] = [bar.querySelector("button"), bar.querySelector("input"), bar.querySelector("span")];
  let playing = true, origin = performance.now();
  const frame = (now) => {
    if (playing) range.value = (((now - origin) / 1000) % D).toFixed(2);
    seek(Number(range.value));
    readout.textContent = Number(range.value).toFixed(2);
    requestAnimationFrame(frame);
  };
  button.onclick = () => { playing = !playing; button.textContent = playing ? "暂停" : "播放"; origin = performance.now() - Number(range.value) * 1000; };
  range.oninput = () => { playing = false; button.textContent = "播放"; };
  requestAnimationFrame(frame);
}
